<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Кампании{% endblock %}</title>
  <style>
    body { max-width: 30rem; margin: 3rem auto; padding: 0 1rem; font: 1rem system-ui; }
    nav { display: flex; flex-wrap: wrap; gap: .75rem; }
    nav a { padding: .55rem .7rem; border: 1px solid; border-radius: .25rem; color: inherit; text-decoration: none; }
    form { display: grid; gap: 1rem; }
    label { display: grid; gap: .35rem; }
    input, button { font: inherit; padding: .55rem .7rem; }
    button { justify-self: start; }
    {% block styles %}{% endblock %}
  </style>
</head>
<body>
  <main>
    {% if request.url.path != url_for('index').path %}
      <nav aria-label="Навигация">
        <a href="{{ url_for('index') }}">Главная</a>
      </nav>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
