[project]
name = "test-task-keitaro"
version = "0.1.0"
description = "FastAPI-сервис для тестового задания Keitaro"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1.6",
    "pydantic>=2",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = ["integration: tests against the real Keitaro emulator"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
